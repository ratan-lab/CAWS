# MultiQC settings for CAWS (FastQC, Trim Galore, Bowtie2, Picard, FastQ Screen)
title: "CAWS quality control"
subtitle: "Read, trimming, alignment, duplication and contamination metrics"
# strip CAWS file name parts so all tools report the same sample names
extra_fn_clean_exts:
  - ".alignments"
  - ".rmdup"
  - ".sorted"
  - "_screen"
  - "_trimmed"
# keep read 1 and read 2 of paired-end samples apart in the FastQC section
sample_names_replace:
  "_val_1": "_R1"
  "_val_2": "_R2"
