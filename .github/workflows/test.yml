name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # rule envs list the defaults channel; avoid an interactive ToS prompt
      CONDA_PLUGINS_AUTO_ACCEPT_TOS: "yes"
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: envs/snakemake-runner.yaml
          activate-environment: caws-snakemake
          conda-remove-defaults: true

      - name: Install tools for test setup
        run: conda install -y -c conda-forge -c bioconda bowtie2=2.5.1 samtools

      - name: Prepare test data
        run: bash .test/setup.sh

      - name: Dry runs (IgG control and deduplication on/off)
        run: |
          for igg in True False; do
            for dedup in True False; do
              echo "igg_control=$igg dedup=$dedup"
              snakemake -s workflow/Snakefile --configfile .test/run/config.json \
                --config igg_control=$igg dedup=$dedup -n --quiet
            done
          done

      - name: Run pipeline on test data
        run: |
          snakemake -s workflow/Snakefile --configfile .test/run/config.json \
            --use-conda --cores 4

      - name: Check outputs
        run: bash .test/check_outputs.sh

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            .test/run/out/logs/
            .snakemake/log/
